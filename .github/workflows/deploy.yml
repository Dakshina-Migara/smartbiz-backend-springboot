name: Deploy SmartBiz Backend to AWS

# We changed this to match your current branch!
on:
  push:
    branches:
      - feat-new

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # We added 'cd SmartBiz' to tell GitHub to go into your sub-folder
      - name: Build with Maven
        run: cd SmartBiz && mvn clean package -DskipTests

      # We updated the path to find the file inside the sub-folder
      - name: Copy file to AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "SmartBiz/target/SmartBiz-0.0.1-SNAPSHOT.war"
          target: "/home/ubuntu/"
          strip_components: 2

      # Restarts the server with the new file
      - name: Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            sudo cp /home/ubuntu/SmartBiz-0.0.1-SNAPSHOT.war /var/www/smartbiz/backend.jar
            sudo systemctl restart smartbiz