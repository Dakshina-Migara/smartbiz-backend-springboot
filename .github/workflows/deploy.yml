name: Deploy SmartBiz Backend to AWS

# This tells GitHub to run the script every time you push to the 'main' branch
on:
  push:
    branches:
      - feat-new

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub downloads your source code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. GitHub installs Java 17 on its own temporary server
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. GitHub builds your heavy .war file
      - name: Build with Maven
        run: cd SmartBiz && mvn clean package -DskipTests

      # 4. GitHub securely transfers the file to your AWS server using your Secrets
      - name: Copy file to AWS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "SmartBiz/target/SmartBiz-0.0.1-SNAPSHOT.war"
          target: "/home/ubuntu/"

      # 5. GitHub logs into AWS, renames the file, moves it, and restarts the engine
      - name: Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            sudo cp /home/ubuntu/target/SmartBiz-0.0.1-SNAPSHOT.war /var/www/smartbiz/backend.jar
            sudo systemctl restart smartbiz